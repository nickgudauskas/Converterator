# Runs ./tests/test.sh on an Apple Silicon Mac and an Intel Mac for every push and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            os: macos-15
          - name: Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The same universal chdman the app bundles (built by chdman.yml), checked against build.sh's SHA-256,
      # so both kinds of Mac test the exact program users get.
      - name: Get the bundled chdman
        run: |
          V=$(sed -nE 's/^CHDMAN_VERSION="([^"]+)"/\1/p' build.sh)
          SHA=$(sed -nE 's/^CHDMAN_SHA256="([^"]+)"/\1/p' build.sh)
          curl -fsSL -o chdman.zip "https://github.com/${{ github.repository }}/releases/download/chdman-$V/chdman-universal.zip"
          echo "$SHA  chdman.zip" | shasum -a 256 -c
          ditto -x -k chdman.zip chdman-pkg
          mkdir -p "$HOME/bin" && cp chdman-pkg/chdman "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Show the machine
        run: |
          uname -m
          sw_vers
          swiftc --version
          chdman | head -1

      - name: Run the tests
        run: ./tests/test.sh
